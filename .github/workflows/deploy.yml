name: CI/CD - Portafolio en GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configurar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npm test -- --watch=false

      - name: Build de Angular
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/dev-portfolio/browser

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verificar despliegue y catálogo
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar que el portafolio responde
        run: |
          URL="${{ needs.deploy.outputs.page_url }}"
          echo "Verificando $URL"
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o page.html -w "%{http_code}" "$URL")
            echo "Intento $i -> estado: $STATUS"
            if [ "$STATUS" = "200" ] && grep -q "<app-root" page.html; then
              echo "✅ El portafolio está publicado y funcionando"
              exit 0
            fi
            sleep 10
          done
          echo "❌ El portafolio no respondió correctamente"
          exit 1

      - name: Comprobar que las apps del catálogo responden
        run: |
          FALLOS=0
          for APP in $(grep -o "https://juanpablo-devia.github.io/[^']*" src/app/data/portfolio.data.ts | sort -u); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP")
            echo "$STATUS  $APP"
            if [ "$STATUS" != "200" ]; then FALLOS=$((FALLOS + 1)); fi
          done
          if [ "$FALLOS" -gt 0 ]; then
            echo "❌ $FALLOS app(s) del catálogo no responden"
            exit 1
          fi
          echo "✅ Todas las apps del catálogo están disponibles"
